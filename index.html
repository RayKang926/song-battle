<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神曲接唱大挑戰 (KTV 語音對戰版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff4081; }
        .control-panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .control-panel label { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            text-align: center;
        }
        #keywordInput { width: 100px; color: #ff4081; font-weight: bold; }
        #timerInput { width: 60px; }
        
        .action-area { margin: 30px 0; }
        .mic-btn {
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            transition: 0.3s;
        }
        .mic-btn:hover { transform: scale(1.1); background: #f50057; }
        .mic-btn.listening { animation: pulse 1s infinite; background: #f50057; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 64, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0); }
        }

        .timer-display { font-size: 48px; font-weight: bold; margin: 15px 0; color: #00e676; }
        .timer-display.danger { color: #ff1744; }

        .card {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            display: none;
            border-left: 5px solid #ff4081;
        }
        .status { font-size: 18px; margin: 15px 0; color: #aaaaaa; min-height: 27px; }
        .highlight { color: #ff4081; font-weight: bold; }
        
        .skip-btn {
            background: #ff9100;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: none;
            margin: 10px auto;
        }
        .skip-btn:hover { background: #ff6d00; }
    </style>
</head>
<body>

    <h1>🎤 神曲接唱大挑戰 🎤</h1>
    
    <div class="control-panel">
        <label>挑戰關鍵字：<input type="text" id="keywordInput" value="我"></label>
        <label>倒數時間 (秒)：<input type="number" id="timerInput" value="15"></label>
    </div>

    <div class="action-area">
        <button id="micBtn" class="mic-btn" onclick="startChallenge()">🎙️</button>
        <div id="timerDisplay" class="timer-display">--</div>
        <button id="skipBtn" class="skip-btn" onclick="skipCurrentMusic()">⏭️ 跳過目前音樂</button>
    </div>

    <div id="status" class="status">點擊麥克風開始挑戰！</div>

    <!-- 玩家歌曲結果 -->
    <div id="playerCard" class="card">
        <h3 style="color: #00e676;">🎯 你的出招</h3>
        <p><strong>辨識內容：</strong> <span id="pTranscript"></span></p>
        <p><strong>🎵 歌名：</strong> <span id="pTitle"></span></p>
        <p><strong>👤 原唱：</strong> <span id="pArtist"></span> (<span id="pYear"></span>)</p>
        <p><em>🔊 正在播放 30 秒試聽...</em></p>
    </div>

    <!-- AI 歌曲結果 -->
    <div id="aiCard" class="card">
        <h3 style="color: #29b6f6;">🤖 AI 的反擊</h3>
        <p><strong>🎵 歌名：</strong> <span id="aTitle"></span></p>
        <p><strong>👤 原唱：</strong> <span id="aArtist"></span> (<span id="aYear"></span>)</p>
        <p><em>🔊 正在播放 30 秒試聽...</em></p>
    </div>

    <!-- 隱藏的音樂播放器 -->
    <audio id="audioPlayer"></audio>

    <script>
        // 檢查瀏覽器是否支援語音辨識
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("你的瀏覽器不支援語音辨識功能，請使用 Google Chrome 開啟！");
        }

        let recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.interimResults = false;

        let countdownInterval;
        let timeLeft;
        let currentPhase = 'idle'; // idle, player, ai
        const audioPlayer = document.getElementById('audioPlayer');
        
        let currentPlayerYear = 0;
        let currentPlayerTrackId = 0;

        // 語音辨識結果處理
        recognition.onresult = async function(event) {
            const transcript = event.results[0][0].transcript;
            const keyword = document.getElementById('keywordInput').value.trim();
            
            clearInterval(countdownInterval);
            document.getElementById('micBtn').classList.remove('listening');
            
            if (!transcript.includes(keyword)) {
                document.getElementById('status').innerHTML = `⚠️ 聽到了「${transcript}」，但裡面沒有<span class='highlight'>「${keyword}」</span>！請重按麥克風再試一次。`;
                return;
            }

            document.getElementById('status').innerText = `🔍 聽到了！正在尋找歌曲：${transcript}...`;
            document.getElementById('pTranscript').innerText = transcript;
            
            await processPlayerTurn(transcript, keyword);
        };

        recognition.onerror = function(event) {
            clearInterval(countdownInterval);
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('status').innerText = "⚠️ 麥克風收音失敗或超時，請重按按鈕。";
        };

        function startChallenge() {
            // 初始化 UI
            document.getElementById('playerCard').style.display = 'none';
            document.getElementById('aiCard').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            audioPlayer.pause();
            
            const keyword = document.getElementById('keywordInput').value.trim();
            timeLeft = parseInt(document.getElementById('timerInput').value);
            
            if (!keyword || isNaN(timeLeft) || timeLeft <= 0) {
                alert("請設定正確的關鍵字和時間！");
                return;
            }

            // 啟動倒數與麥克風
            document.getElementById('status').innerHTML = `🎤 請對著麥克風唱出包含 <span class='highlight'>「${keyword}」</span> 的歌詞！`;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('timerDisplay').innerText = timeLeft;
            document.getElementById('timerDisplay').classList.remove('danger');
            
            recognition.start();

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft;
                
                if (timeLeft <= 5) document.getElementById('timerDisplay').classList.add('danger');
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    recognition.stop();
                    document.getElementById('micBtn').classList.remove('listening');
                    document.getElementById('status').innerText = "⏰ 時間到！挑戰失敗。";
                }
            }, 1000);
        }

        async function processPlayerTurn(query, keyword) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&country=TW&media=music&entity=song&limit=1`);
                const data = await response.json();

                if (data.resultCount === 0) {
                    document.getElementById('status').innerText = "❌ iTunes 上找不到這首歌，請換一首挑戰！";
                    return;
                }

                const track = data.results[0];
                currentPlayerYear = parseInt(track.releaseDate.substring(0, 4));
                currentPlayerTrackId = track.trackId;
                
                document.getElementById('pTitle').innerText = track.trackName;
                document.getElementById('pArtist').innerText = track.artistName;
                document.getElementById('pYear').innerText = currentPlayerYear;
                document.getElementById('playerCard').style.display = 'block';

                // 播放玩家歌曲
                playAudio(track.previewUrl, () => processAITurn(keyword));

            } catch (error) {
                document.getElementById('status').innerText = "⚠️ 網路錯誤，尋找歌曲失敗。";
            }
        }

        async function processAITurn(keyword) {
            document.getElementById('status').innerText = "🤖 換 AI 尋找反擊神曲...";
            
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&country=TW&media=music&entity=song&limit=50`);
                const data = await response.json();

                // 排除玩家剛剛唱的歌，且歌名或歌手要包含關鍵字
                const validTracks = data.results.filter(t => 
                    t.trackId !== currentPlayerTrackId && 
                    (t.trackName.includes(keyword) || t.artistName.includes(keyword))
                );

                if (validTracks.length === 0) {
                    document.getElementById('status').innerText = "🤖 AI 認輸！找不到可以反擊的歌。";
                    return;
                }

                let aiSong = null;
                // 優先尋找前後一年的歌
                for (let track of validTracks) {
                    const year = parseInt(track.releaseDate.substring(0, 4));
                    if (Math.abs(year - currentPlayerYear) <= 1) {
                        aiSong = track;
                        break;
                    }
                }

                // 不顧年份：如果找不到前後一年的，直接拿第一首符合關鍵字的
                if (!aiSong) {
                    aiSong = validTracks[0];
                    console.log("觸發不顧年份機制");
                }

                const aYear = parseInt(aiSong.releaseDate.substring(0, 4));
                const highlightedTitle = aiSong.trackName.replace(new RegExp(keyword, 'g'), `<span class="highlight">${keyword}</span>`);
                
                document.getElementById('aTitle').innerHTML = highlightedTitle;
                document.getElementById('aArtist').innerText = aiSong.artistName;
                document.getElementById('aYear').innerText = aYear;
                document.getElementById('aiCard').style.display = 'block';

                document.getElementById('status').innerText = "🔥 AI 出招！";
                
                // 播放 AI 歌曲
                playAudio(aiSong.previewUrl, () => {
                    document.getElementById('status').innerText = "✅ 雙方接唱完畢！點擊麥克風開始下一回合。";
                    document.getElementById('skipBtn').style.display = 'none';
                });

            } catch (error) {
                document.getElementById('status').innerText = "⚠️ 網路錯誤，AI 尋找失敗。";
            }
        }

        function playAudio(url, onEndedCallback) {
            if (!url) {
                onEndedCallback();
                return;
            }
            audioPlayer.src = url;
            audioPlayer.play();
            
            document.getElementById('skipBtn').style.display = 'block';
            
            audioPlayer.onended = () => {
                document.getElementById('skipBtn').style.display = 'none';
                onEndedCallback();
            };
        }

        function skipCurrentMusic() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            // 觸發 onended 邏輯，進入下一個階段
            if (audioPlayer.onended) {
                audioPlayer.onended();
            }
        }
    </script>
</body>
</html>
