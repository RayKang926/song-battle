<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神曲接唱大挑戰 (全域嚴格去重版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { color: #ff4081; margin-bottom: 5px; }
        .mode-switch { margin: 20px 0; }
        .mode-btn { background: #333; color: white; border: 1px solid #555; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px; margin: 0 5px; transition: 0.2s; }
        .mode-btn.active { background: #ff4081; border-color: #ff4081; font-weight: bold; }
        .stats-bar { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 20px; color: #00e676; font-weight: bold; display: flex; justify-content: space-around; font-size: 18px; border: 1px solid #333; }
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; align-items: center;}
        input[type="text"], input[type="number"] { padding: 8px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; text-align: center; }
        #keywordInput { width: 80px; color: #ff4081; font-weight: bold; }
        .mic-btn { background: #ff4081; color: white; border: none; border-radius: 50%; width: 90px; height: 90px; font-size: 36px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 64, 129, 0.5); transition: 0.3s; margin: 20px 0; }
        .mic-btn:hover { transform: scale(1.1); background: #f50057; }
        .mic-btn.listening { animation: pulse 1s infinite; background: #f50057; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 64, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0); } }
        .timer-display { font-size: 40px; font-weight: bold; margin: 10px 0; color: #00e676; }
        .timer-display.danger { color: #ff1744; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 20px; margin: 15px 0; text-align: left; display: none; border-left: 5px solid #ff4081; }
        .status { font-size: 16px; margin: 10px 0; color: #aaaaaa; min-height: 24px; }
        .lyric-search-btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #00bcd4; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; font-size: 14px;}
        .lyric-search-btn:hover { background: #0097a7; }
        .skip-btn { background: #ff9100; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; margin: 15px auto; font-size: 16px; }
        .skip-btn:hover { background: #ff6d00; }
        
        #practiceArea { display: none; text-align: left; }
        .practice-item { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #00e676;}
        .practice-info { flex-grow: 1; }
        .practice-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px;}
        .practice-artist { color: #aaa; font-size: 14px; }
        .practice-actions { display: flex; gap: 10px; }
        .play-btn { background: #ff9100; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .generate-btn { background: #00e676; color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;}
    </style>
</head>
<body>

    <h1>🎤 神曲接唱大挑戰 🎤</h1>
    
    <div class="mode-switch">
        <button id="btnBattle" class="mode-btn active" onclick="switchMode('battle')">⚔️ 實戰排位模式</button>
        <button id="btnPractice" class="mode-btn" onclick="switchMode('practice')">📖 題庫練習模式</button>
    </div>

    <div class="control-panel">
        <label>關鍵字：<input type="text" id="keywordInput" value="我"></label>
        <label id="timerLabel">倒數 (秒)：<input type="number" id="timerInput" value="15" style="width:50px;"></label>
        <label id="countLabel" style="display:none;">歌曲數量：<input type="number" id="countInput" value="20" style="width:60px;"></label>
    </div>

    <div id="battleArea">
        <div class="stats-bar">
            <span>回合: <span id="roundCount">1</span></span>
            <span>排位: <span id="rankTitle">青銅學徒</span></span>
        </div>
        <div id="status" class="status">點擊麥克風開始第 1 回合！</div>
        <button id="micBtn" class="mic-btn" onclick="startChallenge()">🎙️</button>
        <div id="timerDisplay" class="timer-display">--</div>
        
        <button id="skipBtn" class="skip-btn" onclick="skipCurrentMusic()">⏭️ 跳過音樂</button>
        
        <div id="playerCard" class="card">
            <h3 style="color: #00e676;">🎯 你的出招</h3>
            <p><strong>🎵 歌名：</strong> <span id="pTitle"></span></p>
            <p><strong>👤 原唱：</strong> <span id="pArtist"></span></p>
            <button class="lyric-search-btn" id="pSearchBtn">🎧 在 KKBOX 搜尋歌詞</button>
        </div>

        <div id="aiCard" class="card">
            <h3 style="color: #29b6f6;">🤖 AI 的反擊</h3>
            <p><strong>🎵 歌名：</strong> <span id="aTitle"></span></p>
            <p><strong>👤 原唱：</strong> <span id="aArtist"></span></p>
            <button class="lyric-search-btn" id="aSearchBtn">🎧 在 KKBOX 搜尋歌詞</button>
        </div>
    </div>

    <div id="practiceArea">
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="generate-btn" onclick="generatePracticeList()">🧠 產生關聯神曲題庫</button>
            <p class="status" id="practiceStatus"></p>
        </div>
        <div id="practiceList"></div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if(recognition) { 
            recognition.lang = 'zh-TW'; 
            recognition.interimResults = false;
            recognition.continuous = true; 
        }

        let currentMode = 'battle';
        let countdownInterval;
        let timeLeft;
        let currentRound = 1;
        
        // 全域歌名紀錄庫
        let playedTitles = new Set();
        let popupWindowRef = null; // 紀錄彈出視窗實體
        
        let isSystemListening = false;
        let isAudioUnlocked = false;
        const audioPlayer = document.getElementById('audioPlayer');

        // 終極正規化函式：移除括號內容，並剔除所有空格與特殊符號 (僅保留中英數)
        const getBaseTitle = (name) => {
            let str = name.replace(/[\(（\[【].*?[\)）\]】]/g, '');
            str = str.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
            return str.toLowerCase();
        };

        function unlockAudio() {
            if (isAudioUnlocked) return;
            audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            audioPlayer.play().then(() => { isAudioUnlocked = true; }).catch(() => {});
        }

        function openLyricsPopup(artist, title) {
            const query = encodeURIComponent(`${artist} ${title}`);
            popupWindowRef = window.open(`https://www.kkbox.com/tw/tc/search?q=${query}`, 'lyricsPopup', 'width=450,height=700,scrollbars=yes,resizable=yes');
        }

        function closeLyricsPopup() {
            if (popupWindowRef && !popupWindowRef.closed) {
                popupWindowRef.close();
            }
        }

        function switchMode(mode) {
            closeLyricsPopup(); // 切換模式時關閉 KKBOX 視窗保持整潔
            currentMode = mode;
            audioPlayer.pause();
            clearInterval(countdownInterval);
            if(recognition) recognition.stop();
            
            document.getElementById('btnBattle').classList.toggle('active', mode === 'battle');
            document.getElementById('btnPractice').classList.toggle('active', mode === 'practice');
            
            document.getElementById('battleArea').style.display = mode === 'battle' ? 'block' : 'none';
            document.getElementById('practiceArea').style.display = mode === 'practice' ? 'block' : 'none';
            
            document.getElementById('timerLabel').style.display = mode === 'battle' ? 'inline-block' : 'none';
            document.getElementById('countLabel').style.display = mode === 'practice' ? 'inline-block' : 'none';
        }

        if(recognition) {
            recognition.onresult = async function(event) {
                if(!isSystemListening) return;
                
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript;
                const keyword = document.getElementById('keywordInput').value.trim();
                
                if (!transcript.includes(keyword)) {
                    document.getElementById('status').innerText = `⚠️ 聽到了「${transcript}」，但沒有「${keyword}」，請繼續唱！`;
                    return;
                }
                
                isSystemListening = false;
                recognition.stop();
                clearInterval(countdownInterval);
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('status').innerText = `🔍 辨識成功！查核：${transcript}...`;
                await processPlayerTurn(transcript, keyword);
            };
            
            recognition.onerror = (event) => {
                if(event.error === 'no-speech' && isSystemListening) return;
                clearInterval(countdownInterval);
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('status').innerText = "⚠️ 麥克風異常，請點擊重試。";
            };
        }

        function startChallenge() {
            if(!recognition) return alert("請使用 Chrome 瀏覽器。");
            unlockAudio();
            
            document.getElementById('playerCard').style.display = 'none';
            document.getElementById('aiCard').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            
            const keyword = document.getElementById('keywordInput').value.trim();
            timeLeft = parseInt(document.getElementById('timerInput').value);
            isSystemListening = true;
            
            document.getElementById('status').innerHTML = `⏳ 麥克風啟動中...`;
            setTimeout(() => {
                document.getElementById('status').innerHTML = `🎤 回合 ${currentRound}：請唱出包含「${keyword}」的歌！`;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('timerDisplay').innerText = timeLeft;
                document.getElementById('timerDisplay').classList.remove('danger');
                
                try { recognition.start(); } catch(e) {}

                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = timeLeft;
                    if (timeLeft <= 5) document.getElementById('timerDisplay').classList.add('danger');
                    
                    if (timeLeft <= 0) {
                        clearInterval(countdownInterval);
                        isSystemListening = false;
                        recognition.stop();
                        document.getElementById('micBtn').classList.remove('listening');
                        document.getElementById('status').innerText = "⏰ 時間到！請重按麥克風挑戰。";
                    }
                }, 1000);
            }, 600);
        }

        async function processPlayerTurn(query, keyword) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&country=TW&media=music&entity=song&limit=30`);
                const data = await response.json();

                // 實戰去重：篩選出所有「嚴格正規化歌名」還沒唱過的歌
                let validTracks = data.results.filter(t => !playedTitles.has(getBaseTitle(t.trackName)));
                
                if (validTracks.length === 0) {
                    if(data.resultCount > 0) return document.getElementById('status').innerText = "❌ 拒絕判定：這首歌之前唱過了！請換一首。";
                    return document.getElementById('status').innerText = "❌ 拒絕判定：曲庫查無此歌，請重試！";
                }

                // 以第一首符合條件的嚴格歌名為目標
                const targetTitle = getBaseTitle(validTracks[0].trackName);
                
                // 撈出所有同名歌曲進行經典度與熱度加權競爭
                let sameNameTracks = validTracks.filter(t => getBaseTitle(t.trackName) === targetTitle);

                const currentYear = new Date().getFullYear();
                let bestMatch = null;
                let highestScore = -9999;

                sameNameTracks.forEach((track) => {
                    const originalIndex = validTracks.findIndex(t => t.trackId === track.trackId);
                    let score = (30 - originalIndex) * 5; 
                    const releaseYear = parseInt(track.releaseDate.substring(0, 4));
                    score += (currentYear - releaseYear) * 2; // 歲月紅利

                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = track;
                    }
                });

                let track = bestMatch;
                
                // 記錄已唱過的嚴格歌名 (全域封殺該歌的所有變體)
                playedTitles.add(targetTitle);
                
                document.getElementById('pTitle').innerText = track.trackName;
                document.getElementById('pArtist').innerText = track.artistName; 
                document.getElementById('pSearchBtn').onclick = () => openLyricsPopup(track.artistName, track.trackName);
                document.getElementById('playerCard').style.display = 'block';

                playAudio(track.previewUrl, () => processAITurn(keyword));
            } catch (error) {
                document.getElementById('status').innerText = "⚠️ 網路錯誤。";
            }
        }

        async function processAITurn(keyword) {
            document.getElementById('status').innerText = "🤖 AI 正在反擊...";
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&country=TW&media=music&entity=song&limit=100`);
                const data = await response.json();

                let bestMatch = null;
                let finalTargetTitle = "";

                // AI 尋找第一首嚴格歌名沒出現在歷史紀錄的熱門神曲
                for(let track of data.results) {
                    let baseTitle = getBaseTitle(track.trackName);
                    if (!playedTitles.has(baseTitle)) {
                        bestMatch = track;
                        finalTargetTitle = baseTitle;
                        break;
                    }
                }

                if (!bestMatch) return document.getElementById('status').innerText = "🏆 AI 認輸！";

                playedTitles.add(finalTargetTitle);
                
                document.getElementById('aTitle').innerText = bestMatch.trackName;
                document.getElementById('aArtist').innerText = bestMatch.artistName;
                document.getElementById('aSearchBtn').onclick = () => openLyricsPopup(bestMatch.artistName, bestMatch.trackName);
                document.getElementById('aiCard').style.display = 'block';
                document.getElementById('status').innerText = "🔥 AI 出招！";
                
                playAudio(bestMatch.previewUrl, () => {
                    currentRound++;
                    document.getElementById('roundCount').innerText = currentRound;
                    if(currentRound >= 30) document.getElementById('rankTitle').innerText = "黃金麥霸";
                    
                    document.getElementById('status').innerText = `✅ 準備進入第 ${currentRound} 回合...`;
                    setTimeout(() => { if (currentMode === 'battle') startChallenge(); }, 1500);
                });
            } catch (error) {
                document.getElementById('status').innerText = "⚠️ 網路錯誤。";
            }
        }

        function playAudio(url, onEndedCallback) {
            if (!url) return onEndedCallback();
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.error("播放失敗:", e));
            document.getElementById('skipBtn').style.display = 'block';
            
            audioPlayer.onended = () => {
                document.getElementById('skipBtn').style.display = 'none';
                onEndedCallback();
            };
        }

        function skipCurrentMusic() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            if (audioPlayer.onended) audioPlayer.onended();
        }

        async function generatePracticeList() {
            unlockAudio();
            const keyword = document.getElementById('keywordInput').value.trim();
            const count = parseInt(document.getElementById('countInput').value);
            const statusEl = document.getElementById('practiceStatus');
            const listEl = document.getElementById('practiceList');
            
            if(!keyword || count <= 0) return alert("請輸入正確數值");
            
            statusEl.innerText = "⏳ 正在強制挖掘多樣化的熱門神曲...";
            listEl.innerHTML = "";
            
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&country=TW&media=music&entity=song&limit=200`);
                const data = await response.json();
                
                if(data.resultCount === 0) return statusEl.innerText = "❌ 找不到相關歌曲。";
                
                let uniqueSongs = [];
                let seenTitles = new Set(); 
                let artistCount = {}; 
                
                for(let track of data.results) {
                    if(track.primaryGenreName === "Instrumental" || track.primaryGenreName === "New Age") continue;
                    if(track.trackName.toLowerCase().includes("instrumental") || track.trackName.toLowerCase().includes("live")) continue;

                    let baseTitle = getBaseTitle(track.trackName);
                    artistCount[track.artistName] = (artistCount[track.artistName] || 0) + 1;

                    if(!seenTitles.has(baseTitle) && artistCount[track.artistName] <= 2) {
                        seenTitles.add(baseTitle);
                        uniqueSongs.push(track);
                    }
                }
                
                let finalSongs = uniqueSongs.slice(0, count);
                statusEl.innerText = `✅ 成功過濾並整理 ${finalSongs.length} 首熱門神曲！`;
                
                finalSongs.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = 'practice-item';
                    item.innerHTML = `
                        <div class="practice-info">
                            <div class="practice-title">${index + 1}. ${track.trackName}</div>
                            <div class="practice-artist">${track.artistName}</div>
                        </div>
                        <div class="practice-actions">
                            <button class="play-btn" onclick="playAudio('${track.previewUrl}', () => { document.getElementById('skipBtn').style.display='none'; })">▶️ 試聽</button>
                            <button class="lyric-search-btn" onclick="openLyricsPopup('${track.artistName.replace(/'/g, "\\'")}', '${track.trackName.replace(/'/g, "\\'")}')">🎧 歌詞</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch(e) {
                statusEl.innerText = "⚠️ 網路錯誤。";
            }
        }
    </script>
</body>
</html>
